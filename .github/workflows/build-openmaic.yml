# Builds the OpenMAIC Docker image on GitHub's runners (not on the VPS) and
# pushes it to GitHub Container Registry. Run it from the Actions tab.
name: Build OpenMAIC image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: OpenMAIC release tag to build (see github.com/THU-MAIC/OpenMAIC/releases)
        required: true
        default: v1.4.2

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out OpenMAIC ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          repository: THU-MAIC/OpenMAIC
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase.
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openmaic" >> "$GITHUB_OUTPUT"

      # NEXT_PUBLIC_* build args are left empty, so every feature keeps
      # OpenMAIC's documented default. The heavy MP4 render service is not built.
      # No layer cache: upstream dropped it too (`COPY . .` invalidates it, and
      # exporting it took longer than it saved).
      # Needs the 16 GB runner of a PUBLIC repo: `next build` runs out of
      # memory on the 7 GB runner private repos get.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ inputs.ref }}
            ${{ steps.img.outputs.name }}:latest
